[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minicpm-dream"
version = "0.3.0"
description = "Local MiniCPM memory consolidation for agent harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "miniCPM-memory contributors" }]
keywords = ["minicpm", "agents", "memory", "consolidation", "local-llm", "hermes"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "jinja2>=3.1",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff>=0.6",
  "mypy>=1.11",
  "hypothesis>=6.100",
  "respx>=0.21",
  "numpy>=1.26",
]
openbmb = [
  "torch>=2.2",
  "transformers>=4.37,<5",
  "safetensors>=0.4",
  "numpy>=1.26",
  "protobuf>=4.0",
  "sentencepiece>=0.2",
  "tiktoken>=0.7",
]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
minicpm-dream = "minicpm_dream.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minicpm_dream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs a local model or llama-server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
